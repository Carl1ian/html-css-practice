<style>
  .subscribe-button {
    background-color: rgb(199, 0, 0);
    color: white;
    border: none;

    border-radius: 2px;
    cursor: pointer;
    margin-right: 8px;
    transition: opacity 0.6s;
  }

  }

  .subscribe-button:active {
    opacity: 0.2;
    
  }

    width: 62px;
    cursor: pointer;
    transition: background-color 0.6s, color 0.5s;
  }

  .join-button:hover {
    background-color: rgb(100, 162, 255);
    color: white;
  }

  .join-button:active {
    opacity:0.6
  }

    .tweet-button {

    .github-button {
      background-color: rgb(158, 216, 158);

    }

      cursor: pointer;

      transition: background-color 0.6s;

    .bootstrap-button:hover {
